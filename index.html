<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TextStyle Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body background="photo_2026-11-16_21-42-16.jpg">
    <center>
        <h1 id="head">TextStyle Studio</h1>
    <div id="box" contenteditable="true"></div>
        <div id="container">
           
        <div id ="fontcolorbox">
             <h2>Font Color</h2>
            <button id="red" onclick="redColor()"></button>
    <button id="green" onclick="greenColor()"></button>
    <button id="blue" onclick="blueColor()"></button>
    <button id="orange" onclick="orangeColor()"></button>
    <button id="hotpink" onclick="hotpinkColor()"></button>
    <button id="brown" onclick="brownColor()"></button>
    <button id="yellow" onclick="yellowColor()"></button>
        </div>
        <div id ="bgcolor">
             <h2>BG Color</h2>
            <button id="bg-red" onclick="redBg()"></button>
    <button id="bg-green" onclick="greenBg()"></button>
    <button id="bg-blue" onclick="blueBg()"></button>
    <button id="bg-orange" onclick="orangeBg()"></button>
    <button id="bg-hotpink" onclick="hotpinkBg()"></button>
    <button id="bg-brown" onclick="brownBg()"></button>
    <button id="bg-yellow" onclick="yellowBg()"></button>
        </div>
        <div id ="stylebox">
            <h2>Style Box</h2>

            <button id="arial" onclick="arialFont()">Arial</button>
    <button id="times" onclick="timesFont()">Times</button>
    <button id="courier" onclick="courierFont()">Courier</button>
    <button id="georgia" onclick="georgiaFont()">Georgia</button>
        </div>
        </div>
        </center>
        <script src="index.js"></script>
</body>
</html>
